# Stage 7 accumulator backtest. Declared in docs/decision-log.md, 2026-09-24, before it ran.

# Window over which accumulator error is measured, in months. Equal to the model horizon,
# config/placeholders.toml [horizon] years = 5. Not independent: change the horizon, change this.
window_months = 60

# Pass threshold for L2 on quota released: maximum absolute window error, as a share of stock at
# the window's start. Derived, not assumed: (1 + 0.0025)^5 - 1, the stock added over the horizon
# by the smallest nonzero growth rate LTA has set (Category C, 0.25 percent a year, which the
# Annex A footnote from February 2018 says "will remain"; docs/break-table.md). Rounded to 4 places.
tolerance = 0.0125
